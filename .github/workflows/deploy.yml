name: AWS Branch Deployment

on:
  push:
    branches:
      - '**'  # Triggers on all branches

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Branch Name
        shell: bash
        run: |
          # Replaces slashes with dashes to meet AWS naming rules
          CLEAN_BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//-/g')
          echo "branch=${CLEAN_BRANCH}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change to your AWS region

      - name: Create Deployment Package
        run: |
          zip -r deploy-${{ steps.extract_branch.outputs.branch }}.zip . -x "*.git*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: 'my-aws-app-name' # Your Beanstalk App Name
          environment_name: 'env-${{ steps.extract_branch.outputs.branch }}'
          version_label: 'release-${{ github.sha }}'
          region: us-east-1
          deployment_package: 'deploy-${{ steps.extract_branch.outputs.branch }}.zip'
