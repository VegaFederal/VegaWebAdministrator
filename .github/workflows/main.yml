name: CI/CD Pipeline

on:
  push:
    branches: [ '*' ]
  pull_request:
    types: [closed]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - deploy-production
          - cleanup
      branch:
        description: 'Branch to cleanup (for cleanup action only)'
        required: false
        default: 'main'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up environment
        run: echo "Setting up test environment"
      - name: Run tests
        run: echo "Running tests"

  cleanup-merged-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Read configuration
        run: |
          CONFIG_FILE="config/project-config.json"
          PROJECT_NAME=$(jq -r '.projectName' $CONFIG_FILE)
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      - name: Set cleanup variables
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          BRANCH_SAFE=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g' | cut -c1-20)
          STACK_NAME="${PROJECT_NAME}-${BRANCH_SAFE}"
          echo "Cleaning up branch: $BRANCH_NAME (sanitized: $BRANCH_SAFE)"
          echo "Target stack: $STACK_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "BRANCH_SAFE=$BRANCH_SAFE" >> $GITHUB_ENV
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

      - name: Get bucket names
        run: |
          TEMPLATE_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Parameters[?ParameterKey=='TemplateBucket'].ParameterValue" --output text 2>/dev/null || echo "")
          WEBSITE_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text 2>/dev/null || echo "")
          CLOUDFRONT_LOGS_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='CloudFrontLogsBucketName'].OutputValue" --output text 2>/dev/null || echo "")
          echo "TEMPLATE_BUCKET=$TEMPLATE_BUCKET" >> $GITHUB_ENV
          echo "WEBSITE_BUCKET=$WEBSITE_BUCKET" >> $GITHUB_ENV
          echo "CLOUDFRONT_LOGS_BUCKET=$CLOUDFRONT_LOGS_BUCKET" >> $GITHUB_ENV

      - name: Empty S3 buckets
        continue-on-error: true
        run: |
          
          # Empty all buckets with fault tolerance
          for bucket in "${{ env.WEBSITE_BUCKET }}" "${{ env.CLOUDFRONT_LOGS_BUCKET }}" "${{ env.TEMPLATE_BUCKET }}"; do
            if [ ! -z "$bucket" ]; then
              echo "Checking bucket: $bucket"
              if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
                echo "Emptying bucket: $bucket"
                aws s3 rm s3://$bucket --recursive 2>/dev/null || echo "Failed to empty $bucket, continuing..."
                # Also delete any versioned objects
                aws s3api delete-objects --bucket "$bucket" --delete "$(aws s3api list-object-versions --bucket "$bucket" --query '{Objects: Versions[].{Key: Key, VersionId: VersionId}}' --output json 2>/dev/null || echo '{"Objects":[]}')" 2>/dev/null || echo "Failed to delete versions in $bucket, continuing..."
                aws s3api delete-objects --bucket "$bucket" --delete "$(aws s3api list-object-versions --bucket "$bucket" --query '{Objects: DeleteMarkers[].{Key: Key, VersionId: VersionId}}' --output json 2>/dev/null || echo '{"Objects":[]}')" 2>/dev/null || echo "Failed to delete markers in $bucket, continuing..."
              else
                echo "Bucket $bucket not found or not accessible, skipping..."
              fi
            fi
          done

      - name: Delete CloudFormation stack
        run: |
          if aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} 2>/dev/null; then
            echo "Deleting stack: ${{ env.STACK_NAME }}"
            aws cloudformation delete-stack --stack-name ${{ env.STACK_NAME }}
            
            echo "Waiting for stack deletion..."
            aws cloudformation wait stack-delete-complete --stack-name ${{ env.STACK_NAME }} || true
            
            # Check for any remaining nested stacks and force delete them
            NESTED_STACK_PREFIXES=("${{ env.STACK_NAME }}-SecurityGroupsStack" "${{ env.STACK_NAME }}-ApiLambdaStack" "${{ env.STACK_NAME }}-ContactPageStack" "${{ env.STACK_NAME }}-StaticWebsiteStack")
            
            for prefix in "${NESTED_STACK_PREFIXES[@]}"; do
              for stack in $(aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE --query "StackSummaries[?starts_with(StackName, '$prefix')].StackName" --output text 2>/dev/null || echo ""); do
                if [ ! -z "$stack" ] && aws cloudformation describe-stacks --stack-name "$stack" 2>/dev/null; then
                  echo "Force deleting nested stack: $stack"
                  aws cloudformation delete-stack --stack-name "$stack"
                  aws cloudformation wait stack-delete-complete --stack-name "$stack" || true
                fi
              done
            done
          fi

      - name: Delete template bucket
        run: |
          if [ ! -z "${{ env.TEMPLATE_BUCKET }}" ]; then
            echo "Deleting template bucket: ${{ env.TEMPLATE_BUCKET }}"
            aws s3 rb s3://${{ env.TEMPLATE_BUCKET }} --force || true
          fi

      - name: Remove branch callback URL from shared Cognito User Pool Client
        run: |
          USER_POOL_ID=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/UserPoolId" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          APP_CLIENT_ID=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/AppClientId" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [ -z "$USER_POOL_ID" ] || [ -z "$APP_CLIENT_ID" ]; then
            echo "Shared Cognito pool not found in SSM — nothing to clean up."
            exit 0
          fi

          WEBSITE_BUCKET="${{ env.WEBSITE_BUCKET }}"
          if [ -z "$WEBSITE_BUCKET" ]; then
            echo "No website bucket found — cannot determine CloudFront domain. Skipping."
            exit 0
          fi

          # Derive the CloudFront domain from the stack outputs (already retrieved above)
          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteURL'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -z "$CF_DOMAIN" ]; then
            echo "Could not resolve CloudFront domain — skipping callback removal."
            exit 0
          fi

          STALE_CALLBACK="https://${CF_DOMAIN}/callback"
          STALE_LOGOUT="https://${CF_DOMAIN}/"

          CURRENT=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$APP_CLIENT_ID" \
            --query "UserPoolClient" --output json)

          NEW_CALLBACKS=$(echo "$CURRENT" | jq --arg url "$STALE_CALLBACK" \
            '[.CallbackURLs[] | select(. != $url)]')
          NEW_LOGOUTS=$(echo "$CURRENT" | jq --arg url "$STALE_LOGOUT" \
            '[.LogoutURLs[] | select(. != $url)]')

          # Cognito requires at least one callback URL — guard against empty list
          CB_COUNT=$(echo "$NEW_CALLBACKS" | jq 'length')
          if [ "$CB_COUNT" -eq 0 ]; then
            echo "Removal would leave zero callback URLs — skipping to avoid breaking the client."
            exit 0
          fi

          aws cognito-idp update-user-pool-client \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$APP_CLIENT_ID" \
            --allowed-o-auth-flows code \
            --allowed-o-auth-flows-user-pool-client \
            --allowed-o-auth-scopes openid email profile \
            --supported-identity-providers Google \
            --explicit-auth-flows ALLOW_REFRESH_TOKEN_AUTH \
            --callback-urls "$NEW_CALLBACKS" \
            --logout-urls "$NEW_LOGOUTS"

          echo "Removed $STALE_CALLBACK from User Pool Client $APP_CLIENT_ID"

  deploy:
    if: (github.event_name == 'push' && github.event.commits[0] != null) || (github.event.inputs.action == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Read configuration
        id: config
        run: |
          CONFIG_FILE="config/project-config.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Config file not found at $CONFIG_FILE"
            exit 1
          fi

          PROJECT_NAME=$(jq -r '.projectName' $CONFIG_FILE)
          VPC_ID=$(jq -r '.vpcId' $CONFIG_FILE)
          SUBNET_IDS=$(jq -r '.subnetIds' $CONFIG_FILE)

          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "VPC_ID=$VPC_ID" >> $GITHUB_ENV
          echo "SUBNET_IDS=$SUBNET_IDS" >> $GITHUB_ENV

      - name: Set environment variables
        run: |
          # Extract branch name and sanitize for AWS resource naming
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          BRANCH_SAFE=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g' | cut -c1-20)
          
          # Use branch name as environment
          ENVIRONMENT="$BRANCH_SAFE"
          STACK_NAME="${PROJECT_NAME}-${ENVIRONMENT}"
          
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

      - name: Set shared database environment
        run: |
          echo "DB_ENVIRONMENT=dev" >> $GITHUB_ENV

      - name: Resolve shared database from vegaWebAdmin
        run: |
          DB_STACK_NAME="vega-database-${{ env.DB_ENVIRONMENT }}"
          if ! aws cloudformation describe-stacks --stack-name $DB_STACK_NAME 2>/dev/null; then
            echo "ERROR: Shared database stack $DB_STACK_NAME not found."
            echo "The static database must be created by vegaWebAdmin first (VegaFederal/vegaWebAdmin#418)."
            exit 1
          fi
          DB_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name $DB_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='TeamMembersTableName'].OutputValue" \
            --output text)
          DB_TABLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name $DB_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='TeamMembersTableArn'].OutputValue" \
            --output text)
          if [ -z "$DB_TABLE_NAME" ] || [ "$DB_TABLE_NAME" = "None" ]; then
            echo "ERROR: TeamMembersTableName output not found on $DB_STACK_NAME"
            exit 1
          fi
          echo "Using shared table: $DB_TABLE_NAME"
          echo "DB_TABLE_NAME=$DB_TABLE_NAME" >> $GITHUB_ENV
          echo "DB_TABLE_ARN=$DB_TABLE_ARN" >> $GITHUB_ENV

      - name: Resolve shared assets
        run: |
          ASSETS_STACK_NAME="vega-assets-${{ env.DB_ENVIRONMENT }}"
          if ! aws cloudformation describe-stacks --stack-name $ASSETS_STACK_NAME 2>/dev/null; then
            echo "ERROR: Shared assets stack $ASSETS_STACK_NAME not found."
            echo "The static assets bucket must be created by vegaWebAdmin first."
            exit 1
          fi
          ASSETS_BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name $ASSETS_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          if [ -z "$ASSETS_BUCKET_NAME" ] || [ "$ASSETS_BUCKET_NAME" = "None" ]; then
            echo "ERROR: BucketName output not found on $ASSETS_STACK_NAME"
            exit 1
          fi
          echo "Using shared assets bucket: $ASSETS_BUCKET_NAME"
          echo "ASSETS_BUCKET_NAME=$ASSETS_BUCKET_NAME" >> $GITHUB_ENV

      - name: Create template bucket
        run: |
            TIMESTAMP=$(date +%s)
            # Convert project name to lowercase and replace invalid characters
            PROJECT_NAME_LOWER=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
            TEMPLATE_BUCKET="${PROJECT_NAME_LOWER}-${ENVIRONMENT}-templates-${TIMESTAMP}"
            echo "TEMPLATE_BUCKET=$TEMPLATE_BUCKET" >> $GITHUB_ENV

            echo "Creating bucket: $TEMPLATE_BUCKET"
            aws s3 mb s3://$TEMPLATE_BUCKET

      - name: Upload templates to S3
        run: aws s3 sync infrastructure/cloudformation/templates/ s3://$TEMPLATE_BUCKET/templates/

      - name: Package Lambda functions
        run: |
          cd src/lambda/team-members
          zip index.zip index.py
          aws s3 cp index.zip s3://$TEMPLATE_BUCKET/$ENVIRONMENT/lambda/team-members/index.zip

      - name: Package group-check Lambda
        run: |
          cd src/lambda/group-check
          pip install -r requirements.txt --target ./package --quiet
          cp index.py ./package/
          cd package && zip -r ../index.zip . -q
          cd ..
          aws s3 cp index.zip s3://$TEMPLATE_BUCKET/$ENVIRONMENT/lambda/group-check/index.zip
          rm -rf package index.zip

      #  Determine if this is the main branch 
      - name: Set branch type
        run: |
          if [ "${{ env.ENVIRONMENT }}" = "main" ]; then
            echo "IS_MAIN_BRANCH=true" >> $GITHUB_ENV
          else
            echo "IS_MAIN_BRANCH=false" >> $GITHUB_ENV
          fi

      # ── Pass 1: deploy infrastructure without Cognito.
      #    CallbackUrl is empty so DeployCognito condition is false — Cognito skipped.
      #    CloudFront is created here and its domain is read after this step.
      - name: Deploy CloudFormation stack — pass 1
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infrastructure/cloudformation/main-template.yaml
          parameter-overrides: >-
            Environment=${{ env.ENVIRONMENT }},
            VpcId=${{ env.VPC_ID }},
            SubnetIds=${{ env.SUBNET_IDS }},
            TemplateBucket=${{ env.TEMPLATE_BUCKET }},
            DeploymentBucket=${{ env.TEMPLATE_BUCKET }},
            TableName=${{ env.DB_TABLE_NAME }},
            TableArn=${{ env.DB_TABLE_ARN }},
            AssetsBucketName=${{ env.ASSETS_BUCKET_NAME }},
            CallbackUrl=,
            LogoutUrl=
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_NAMED_IAM"

      #  Resolve CloudFront domain 
      - name: Resolve CloudFront domain
        run: |
          CF_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteURL'].OutputValue" \
            --output text)
          echo "CF_DOMAIN=$CF_DOMAIN" >> $GITHUB_ENV
          echo "CALLBACK_URL=https://${CF_DOMAIN}/callback" >> $GITHUB_ENV
          echo "LOGOUT_URL=https://${CF_DOMAIN}/" >> $GITHUB_ENV

      #  MAIN BRANCH ONLY: validate credentials and deploy Cognito 
      - name: Validate Google OAuth credentials
        if: env.IS_MAIN_BRANCH == 'true'
        run: |
          if [ -z "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" ]; then
            echo "ERROR: GOOGLE_OAUTH_CLIENT_ID GitHub Actions secret is not set."
            exit 1
          fi
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" >> $GITHUB_ENV
          echo "::add-mask::${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" >> $GITHUB_ENV

      - name: Deploy CloudFormation stack — pass 2 (main branch — creates Cognito)
        if: env.IS_MAIN_BRANCH == 'true'
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infrastructure/cloudformation/main-template.yaml
          parameter-overrides: >-
            Environment=${{ env.ENVIRONMENT }},
            VpcId=${{ env.VPC_ID }},
            SubnetIds=${{ env.SUBNET_IDS }},
            TemplateBucket=${{ env.TEMPLATE_BUCKET }},
            DeploymentBucket=${{ env.TEMPLATE_BUCKET }},
            TableName=${{ env.DB_TABLE_NAME }},
            TableArn=${{ env.DB_TABLE_ARN }},
            AssetsBucketName=${{ env.ASSETS_BUCKET_NAME }},
            CallbackUrl=${{ env.CALLBACK_URL }},
            LogoutUrl=${{ env.LOGOUT_URL }},
            AllowedGroupEmail=,
            GoogleOAuthClientId=${{ env.GOOGLE_CLIENT_ID }},
            GoogleOAuthClientSecret=${{ env.GOOGLE_CLIENT_SECRET }}
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_NAMED_IAM"

      #  Register this CloudFront domain on the shared
      #    Cognito User Pool Client so the callback works.
      #    For main: the client was just created — add localhost + main domain.
      #    For branches: the client already exists — append the branch domain.
      - name: Register callback URL on shared Cognito User Pool Client
        run: |
          # Read shared Cognito values from SSM (written by the main branch Cognito stack)
          USER_POOL_ID=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/UserPoolId" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          APP_CLIENT_ID=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/AppClientId" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [ -z "$USER_POOL_ID" ] || [ -z "$APP_CLIENT_ID" ]; then
            echo "Shared Cognito User Pool not found in SSM — skipping callback registration."
            echo "This is expected on the very first main-branch deploy before Cognito exists."
            exit 0
          fi

          NEW_CALLBACK="https://${{ env.CF_DOMAIN }}/callback"
          NEW_LOGOUT="https://${{ env.CF_DOMAIN }}/"

          # Get current callback URLs on the client
          CURRENT=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$APP_CLIENT_ID" \
            --query "UserPoolClient" --output json)

          CURRENT_CALLBACKS=$(echo "$CURRENT" | jq -r '[.CallbackURLs[]] | @json')
          CURRENT_LOGOUTS=$(echo "$CURRENT" | jq -r '[.LogoutURLs[]] | @json')

          # Add new URLs if not already present
          NEW_CALLBACKS=$(echo "$CURRENT_CALLBACKS" | jq --arg url "$NEW_CALLBACK" \
            'if contains([$url]) then . else . + [$url] end')
          NEW_LOGOUTS=$(echo "$CURRENT_LOGOUTS" | jq --arg url "$NEW_LOGOUT" \
            'if contains([$url]) then . else . + [$url] end')

          # Also ensure localhost is registered (for local dev)
          NEW_CALLBACKS=$(echo "$NEW_CALLBACKS" | jq \
            'if contains(["http://localhost:5173/callback"]) then . else . + ["http://localhost:5173/callback"] end')
          NEW_LOGOUTS=$(echo "$NEW_LOGOUTS" | jq \
            'if contains(["http://localhost:5173/"]) then . else . + ["http://localhost:5173/"] end')

          aws cognito-idp update-user-pool-client \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$APP_CLIENT_ID" \
            --allowed-o-auth-flows code \
            --allowed-o-auth-flows-user-pool-client \
            --allowed-o-auth-scopes openid email profile \
            --supported-identity-providers Google \
            --explicit-auth-flows ALLOW_REFRESH_TOKEN_AUTH \
            --callback-urls "$NEW_CALLBACKS" \
            --logout-urls "$NEW_LOGOUTS"

          echo "Registered $NEW_CALLBACK on User Pool Client $APP_CLIENT_ID"

      #  Edge Lambda: package with Cognito config baked in,
      #    deploy the function/version, then re-run main-template to attach it
      #    to CloudFront as a viewer-request trigger 
      - name: Package and deploy auth-edge Lambda@Edge
        run: |
          # Cognito config comes from the shared SSM parameters (written by main's Cognito stack).
          USER_POOL_ID=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/UserPoolId" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          APP_CLIENT_ID=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/AppClientId" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          COGNITO_DOMAIN=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/HostedUIDomain" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          if [ -z "$USER_POOL_ID" ] || [ -z "$APP_CLIENT_ID" ] || [ -z "$COGNITO_DOMAIN" ]; then
            echo "Shared Cognito config not found in SSM yet — skipping auth-edge wiring."
            echo "This is expected on the very first main deploy before Cognito exists."
            echo "AUTH_EDGE_READY=false" >> $GITHUB_ENV
            exit 0
          fi

          # Package the function with config substituted in; captures AUTH_EDGE_S3_KEY.
          OUTPUT=$(USER_POOL_ID="$USER_POOL_ID" \
            APP_CLIENT_ID="$APP_CLIENT_ID" \
            COGNITO_DOMAIN="$COGNITO_DOMAIN" \
            CALLBACK_URL="${{ env.CALLBACK_URL }}" \
            AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}" \
            DEPLOYMENT_BUCKET="${{ env.TEMPLATE_BUCKET }}" \
            ENVIRONMENT="${{ env.ENVIRONMENT }}" \
            bash scripts/package-auth-edge.sh)
          echo "$OUTPUT"
          AUTH_EDGE_S3_KEY=$(echo "$OUTPUT" | grep '^AUTH_EDGE_S3_KEY=' | cut -d= -f2-)
          echo "AUTH_EDGE_S3_KEY=$AUTH_EDGE_S3_KEY" >> $GITHUB_ENV
          echo "AUTH_EDGE_READY=true" >> $GITHUB_ENV

      # Deploy the auth-edge stack 
      # by re-running main-template with the S3 key set. 
      - name: Deploy CloudFormation — create auth-edge function
        if: env.AUTH_EDGE_READY == 'true'
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infrastructure/cloudformation/main-template.yaml
          parameter-overrides: >-
            Environment=${{ env.ENVIRONMENT }},
            VpcId=${{ env.VPC_ID }},
            SubnetIds=${{ env.SUBNET_IDS }},
            TemplateBucket=${{ env.TEMPLATE_BUCKET }},
            DeploymentBucket=${{ env.TEMPLATE_BUCKET }},
            TableName=${{ env.DB_TABLE_NAME }},
            TableArn=${{ env.DB_TABLE_ARN }},
            AssetsBucketName=${{ env.ASSETS_BUCKET_NAME }},
            CallbackUrl=${{ env.CALLBACK_URL }},
            LogoutUrl=${{ env.LOGOUT_URL }},
            AllowedGroupEmail=,
            GoogleOAuthClientId=${{ env.GOOGLE_CLIENT_ID }},
            GoogleOAuthClientSecret=${{ env.GOOGLE_CLIENT_SECRET }},
            AuthEdgeS3Key=${{ env.AUTH_EDGE_S3_KEY }}
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_NAMED_IAM"

      # Read the published version ARN, then re-run once more to attach it to CloudFront.
      - name: Resolve auth-edge version ARN and attach to CloudFront
        if: env.AUTH_EDGE_READY == 'true'
        run: |
          AUTH_EDGE_VERSION_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='AuthEdgeVersionArn'].OutputValue" \
            --output text)
          echo "AUTH_EDGE_VERSION_ARN=$AUTH_EDGE_VERSION_ARN" >> $GITHUB_ENV

      - name: Deploy CloudFormation — attach auth-edge to CloudFront
        if: env.AUTH_EDGE_READY == 'true'
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infrastructure/cloudformation/main-template.yaml
          parameter-overrides: >-
            Environment=${{ env.ENVIRONMENT }},
            VpcId=${{ env.VPC_ID }},
            SubnetIds=${{ env.SUBNET_IDS }},
            TemplateBucket=${{ env.TEMPLATE_BUCKET }},
            DeploymentBucket=${{ env.TEMPLATE_BUCKET }},
            TableName=${{ env.DB_TABLE_NAME }},
            TableArn=${{ env.DB_TABLE_ARN }},
            AssetsBucketName=${{ env.ASSETS_BUCKET_NAME }},
            CallbackUrl=${{ env.CALLBACK_URL }},
            LogoutUrl=${{ env.LOGOUT_URL }},
            AllowedGroupEmail=,
            GoogleOAuthClientId=${{ env.GOOGLE_CLIENT_ID }},
            GoogleOAuthClientSecret=${{ env.GOOGLE_CLIENT_SECRET }},
            AuthEdgeS3Key=${{ env.AUTH_EDGE_S3_KEY }},
            AuthEdgeVersionArn=${{ env.AUTH_EDGE_VERSION_ARN }}
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_NAMED_IAM"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Resolve API endpoint
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "VITE_API_URL=$API_URL" >> .env.production

      - name: Build website
        run: npm run build

      - name: Upload website files
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          aws s3 sync dist/ s3://$BUCKET_NAME/ --delete

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

      - name: Print deployment summary
        run: |
          USER_POOL_ID=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/UserPoolId" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          COGNITO_DOMAIN=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/HostedUIDomain" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          IDP_RESPONSE_URL=$(aws ssm get-parameter \
            --name "/vegawebadmin/shared/cognito/IdpResponseUrl" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")

          echo "========================================"
          echo "Branch:      ${{ env.BRANCH_NAME }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "App URL:     https://${{ env.CF_DOMAIN }}"
          echo "API URL:     $API_URL"
          if [ -n "$COGNITO_DOMAIN" ]; then
            echo "Cognito UI:  $COGNITO_DOMAIN"
          fi
          if [ "${{ env.IS_MAIN_BRANCH }}" = "true" ] && [ -n "$IDP_RESPONSE_URL" ]; then
            echo "----------------------------------------"
            echo "ACTION REQUIRED (one-time) — add this URI to the Google OAuth client:"
            echo "  $IDP_RESPONSE_URL"
          fi
          echo "========================================"

  deploy-production:
    if: github.event.inputs.action == 'deploy-production' || (github.ref == 'refs/heads/production' && github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.PROD_AWS_REGION || 'us-east-1' }}

      - name: Read configuration
        id: config
        run: |
          CONFIG_FILE="config/production-config.json"
          PROJECT_NAME=$(jq -r '.projectName' $CONFIG_FILE)
          VPC_ID=$(jq -r '.vpcId' $CONFIG_FILE)
          AI_MODEL=$(jq -r '.aiModel' $CONFIG_FILE)
          DOMAIN_NAME=$(jq -r '.domainName // ""' $CONFIG_FILE)
          WWW_DOMAIN=$(jq -r '.wwwDomain // ""' $CONFIG_FILE)
          CERTIFICATE_ARN=$(jq -r '.certificateArn // ""' $CONFIG_FILE)
          CREATE_HOSTED_ZONE=$(jq -r '.createHostedZone // "false"' $CONFIG_FILE)

          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "VPC_ID=$VPC_ID" >> $GITHUB_ENV
          echo "AI_MODEL=$AI_MODEL" >> $GITHUB_ENV
          echo "DOMAIN_NAME=$DOMAIN_NAME" >> $GITHUB_ENV
          echo "WWW_DOMAIN=$WWW_DOMAIN" >> $GITHUB_ENV
          echo "CERTIFICATE_ARN=$CERTIFICATE_ARN" >> $GITHUB_ENV
          echo "CREATE_HOSTED_ZONE=$CREATE_HOSTED_ZONE" >> $GITHUB_ENV

      - name: Set production environment variables
        run: |
          STACK_NAME="VegaProductionStack"
          ENVIRONMENT="production"
          
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV
          echo "DB_ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

      - name: Resolve shared database from vegaWebAdmin
        run: |
          DB_STACK_NAME="vega-database-${{ env.DB_ENVIRONMENT }}"
          if ! aws cloudformation describe-stacks --stack-name $DB_STACK_NAME 2>/dev/null; then
            echo "ERROR: Shared database stack $DB_STACK_NAME not found."
            echo "The static database must be created by vegaWebAdmin first (VegaFederal/vegaWebAdmin#418)."
            exit 1
          fi
          DB_TABLE_NAME=$(aws cloudformation describe-stacks \
            --stack-name $DB_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='TeamMembersTableName'].OutputValue" \
            --output text)
          DB_TABLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name $DB_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='TeamMembersTableArn'].OutputValue" \
            --output text)
          if [ -z "$DB_TABLE_NAME" ] || [ "$DB_TABLE_NAME" = "None" ]; then
            echo "ERROR: TeamMembersTableName output not found on $DB_STACK_NAME"
            exit 1
          fi
          echo "Using shared table: $DB_TABLE_NAME"
          echo "DB_TABLE_NAME=$DB_TABLE_NAME" >> $GITHUB_ENV
          echo "DB_TABLE_ARN=$DB_TABLE_ARN" >> $GITHUB_ENV

      - name: Resolve shared assets
        run: |
          ASSETS_STACK_NAME="vega-assets-${{ env.DB_ENVIRONMENT }}"
          if ! aws cloudformation describe-stacks --stack-name $ASSETS_STACK_NAME 2>/dev/null; then
            echo "ERROR: Shared assets stack $ASSETS_STACK_NAME not found."
            echo "The static assets bucket must be created by vegaWebAdmin first."
            exit 1
          fi
          ASSETS_BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name $ASSETS_STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          if [ -z "$ASSETS_BUCKET_NAME" ] || [ "$ASSETS_BUCKET_NAME" = "None" ]; then
            echo "ERROR: BucketName output not found on $ASSETS_STACK_NAME"
            exit 1
          fi
          echo "Using shared assets bucket: $ASSETS_BUCKET_NAME"
          echo "ASSETS_BUCKET_NAME=$ASSETS_BUCKET_NAME" >> $GITHUB_ENV

      - name: Create template bucket
        run: |
            TIMESTAMP=$(date +%s)
            PROJECT_NAME_LOWER=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]')
            TEMPLATE_BUCKET="${PROJECT_NAME_LOWER}-production-templates-${TIMESTAMP}"
            echo "TEMPLATE_BUCKET=$TEMPLATE_BUCKET" >> $GITHUB_ENV

            echo "Creating bucket: $TEMPLATE_BUCKET"
            aws s3 mb s3://$TEMPLATE_BUCKET

      - name: Upload templates to S3
        run: aws s3 sync infrastructure/cloudformation/templates/ s3://$TEMPLATE_BUCKET/templates/

      - name: Package Lambda functions
        run: |
          cd src/lambda/team-members
          zip index.zip index.py
          aws s3 cp index.zip s3://$TEMPLATE_BUCKET/$ENVIRONMENT/lambda/team-members/index.zip

      - name: Package group-check Lambda
        run: |
          cd src/lambda/group-check
          pip install -r requirements.txt --target ./package --quiet
          cp index.py ./package/
          cd package && zip -r ../index.zip . -q
          cd ..
          aws s3 cp index.zip s3://$TEMPLATE_BUCKET/$ENVIRONMENT/lambda/group-check/index.zip
          rm -rf package index.zip

      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ${{ env.STACK_NAME }}
          template: infrastructure/cloudformation/main-template.yaml
          parameter-overrides: >-
            Environment=${{ env.ENVIRONMENT }},
            VpcId=${{ env.VPC_ID }},
            TemplateBucket=${{ env.TEMPLATE_BUCKET }},
            DeploymentBucket=${{ env.TEMPLATE_BUCKET }},
            TableName=${{ env.DB_TABLE_NAME }},
            TableArn=${{ env.DB_TABLE_ARN }},
            AssetsBucketName=${{ env.ASSETS_BUCKET_NAME }},
            DomainName=${{ env.DOMAIN_NAME }},
            WwwDomain=${{ env.WWW_DOMAIN }},
            CertificateArn=${{ env.CERTIFICATE_ARN }},
            CreateHostedZone=${{ env.CREATE_HOSTED_ZONE }}
          no-fail-on-empty-changeset: "1"
          capabilities: "CAPABILITY_NAMED_IAM"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Resolve API endpoint
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "VITE_API_URL=$API_URL" >> .env.production

      - name: Build website
        run: npm run build

      - name: Upload website files
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          aws s3 sync dist/ s3://$BUCKET_NAME/

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"

      - name: Get CloudFront URL
        run: |
          CF_URL=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text)
          echo "Production deployment completed!"
          echo "Your production website is available at: https://$CF_URL"
          echo "Team members API: $API_URL"
  cleanup:
    if: github.event.inputs.action == 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Read configuration
        id: config
        run: |
          CONFIG_FILE="config/project-config.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Config file not found at $CONFIG_FILE"
            exit 1
          fi

          PROJECT_NAME=$(jq -r '.projectName' $CONFIG_FILE)
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      - name: Set cleanup variables
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch || 'main' }}"
          BRANCH_SAFE=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-\|-$//g' | cut -c1-20)
          STACK_NAME="${PROJECT_NAME}-${BRANCH_SAFE}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "BRANCH_SAFE=$BRANCH_SAFE" >> $GITHUB_ENV
          echo "STACK_NAME=$STACK_NAME" >> $GITHUB_ENV

      - name: Get bucket names
        run: |
          TEMPLATE_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Parameters[?ParameterKey=='TemplateBucket'].ParameterValue" --output text 2>/dev/null || echo "")
          WEBSITE_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text 2>/dev/null || echo "")
          CLOUDFRONT_LOGS_BUCKET=$(aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='CloudFrontLogsBucketName'].OutputValue" --output text 2>/dev/null || echo "")
          echo "TEMPLATE_BUCKET=$TEMPLATE_BUCKET" >> $GITHUB_ENV
          echo "WEBSITE_BUCKET=$WEBSITE_BUCKET" >> $GITHUB_ENV
          echo "CLOUDFRONT_LOGS_BUCKET=$CLOUDFRONT_LOGS_BUCKET" >> $GITHUB_ENV

      - name: Empty S3 buckets
        continue-on-error: true
        run: |
          for bucket in "${{ env.WEBSITE_BUCKET }}" "${{ env.CLOUDFRONT_LOGS_BUCKET }}" "${{ env.TEMPLATE_BUCKET }}"; do
            if [ ! -z "$bucket" ]; then
              echo "Checking bucket: $bucket"
              if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
                echo "Emptying bucket: $bucket"
                aws s3 rm s3://$bucket --recursive 2>/dev/null || echo "Failed to empty $bucket, continuing..."
                aws s3api delete-objects --bucket "$bucket" --delete "$(aws s3api list-object-versions --bucket "$bucket" --query '{Objects: Versions[].{Key: Key, VersionId: VersionId}}' --output json 2>/dev/null || echo '{"Objects":[]}')" 2>/dev/null || echo "Failed to delete versions in $bucket, continuing..."
                aws s3api delete-objects --bucket "$bucket" --delete "$(aws s3api list-object-versions --bucket "$bucket" --query '{Objects: DeleteMarkers[].{Key: Key, VersionId: VersionId}}' --output json 2>/dev/null || echo '{"Objects":[]}')" 2>/dev/null || echo "Failed to delete markers in $bucket, continuing..."
              else
                echo "Bucket $bucket not found or not accessible, skipping..."
              fi
            fi
          done
      - name: Delete CloudFormation stack
        run: |
          if aws cloudformation describe-stacks --stack-name ${{ env.STACK_NAME }} 2>/dev/null; then
            echo "Deleting stack: ${{ env.STACK_NAME }}"
            aws cloudformation delete-stack --stack-name ${{ env.STACK_NAME }}
            
            echo "Waiting for stack deletion..."
            aws cloudformation wait stack-delete-complete --stack-name ${{ env.STACK_NAME }} || true
            
            NESTED_STACK_PREFIXES=("${{ env.STACK_NAME }}-SecurityGroupsStack" "${{ env.STACK_NAME }}-ApiLambdaStack" "${{ env.STACK_NAME }}-ContactPageStack" "${{ env.STACK_NAME }}-StaticWebsiteStack")
            
            for prefix in "${NESTED_STACK_PREFIXES[@]}"; do
              for stack in $(aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE --query "StackSummaries[?starts_with(StackName, '$prefix')].StackName" --output text 2>/dev/null || echo ""); do
                if [ ! -z "$stack" ] && aws cloudformation describe-stacks --stack-name "$stack" 2>/dev/null; then
                  echo "Force deleting nested stack: $stack"
                  aws cloudformation delete-stack --stack-name "$stack"
                  aws cloudformation wait stack-delete-complete --stack-name "$stack" || true
                fi
              done
            done
          fi

      - name: Delete template bucket
        if: env.TEMPLATE_BUCKET != ''
        run: |
          echo "Deleting template bucket: ${{ env.TEMPLATE_BUCKET }}"
          aws s3 rb s3://${{ env.TEMPLATE_BUCKET }} --force
