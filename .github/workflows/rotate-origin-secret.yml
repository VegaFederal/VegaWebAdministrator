name: Rotate origin verify secret

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Rotate secret, update stacks, invalidate CloudFront
        run: |
          # API and CloudFront are nested in the main stack. CloudFormation
          # updates those nested stacks through this root stack.
          PROJECT_NAME=$(jq -r '.projectName' config/project-config.json)
          STACK_NAME="${PROJECT_NAME}-main"

          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          aws secretsmanager put-secret-value \
            --secret-id "/main/origin-verify" \
            --secret-string "$(jq -n --arg token "$TOKEN" '{token:$token}')"

          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/main-template.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides "OriginVerifySecret=${TOKEN}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
