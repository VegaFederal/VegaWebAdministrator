AWSTemplateFormatVersion: '2010-09-09'
Description: Main CloudFormation template that orchestrates nested stacks for a web application

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: The deployment environment
  
  VpcId:
    Type: String
    Description: ID of the existing company VPC

  TemplateBucket:
    Type: String
    Description: S3 bucket containing CloudFormation templates

  SubnetIds:
    Type: String
    Description: Comma-delimited list of subnet IDs for deployment

  DomainName:
    Type: String
    Default: ""
    Description: Custom domain name (e.g., example.com)

  WwwDomain:
    Type: String
    Default: ""
    Description: WWW subdomain (e.g., www.vegafederal.com)

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM Certificate ARN for HTTPS

  CreateHostedZone:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create Route 53 hosted zone for domain

  DeploymentBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  TableName:
    Type: String
    Description: Shared DynamoDB table name (e.g. team-members-dev, team-members-production)

  TableArn:
    Type: String
    Description: Shared DynamoDB table ARN

  AssetsBucketName:
    Type: String
    Description: Shared assets S3 bucket name

  AllowedOrigin:
    Type: String
    Default: ""
    Description: Allowed site origin for Lambda (e.g. https://d123.cloudfront.net or https://vegafederal.com)

  # Cognito / Google SSO 
  GoogleOAuthClientId:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth client ID (read from GitHub Actions secret in CI)

  GoogleOAuthClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth client secret (read from GitHub Actions secret in CI)

  AllowedGroupEmail:
    Type: String
    Default: ""
    Description: >
      Google Group email for prod group-membership enforcement.
      Empty = dev pass-through. Set in production-config.json for prod.

  CallbackUrl:
    Type: String
    Default: ""
    Description: >
      Cognito OAuth callback URL. Resolved in CI from the CloudFront domain output
      after the first deploy. Empty on first deploy — Cognito stack is skipped until known.

  LogoutUrl:
    Type: String
    Default: ""
    Description: Post-logout redirect URL (same base domain as CallbackUrl, path /)

  # Auth-edge (Lambda@Edge) — packaged in CI with Cognito config baked in.
  AuthEdgeS3Key:
    Type: String
    Default: ""
    Description: >
      S3 key of the packaged auth-edge ZIP. Empty on the first pass (before Cognito
      config is known); set on the second pass so the auth-edge stack is created.

  AuthEdgeVersionArn:
    Type: String
    Default: ""
    Description: >
      Version ARN of the auth-edge function, fed back into CloudFront to attach the
      viewer-request trigger. Empty until the auth-edge stack has been deployed.

Conditions:
  HasVpcConfig: !Not [!Equals [!Ref VpcId, '']]
  # Cognito is only deployed on the main branch — all other branches share it
  HasCognitoConfig: !Not [!Equals [!Ref CallbackUrl, '']]
  IsMainBranch: !Equals [!Ref Environment, 'main']
  DeployCognito: !And
    - !Condition HasCognitoConfig
    - !Condition IsMainBranch
  # Auth-edge is deployed per-branch once its packaged ZIP key is known.
  DeployAuthEdge: !Not [!Equals [!Ref AuthEdgeS3Key, '']]

Resources:
  # Secrets stack for Google SSO.
  SecretsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/secrets.yaml
      Parameters:
        Environment: !Ref Environment
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Security Groups Stack
  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/security-groups.yaml
      Parameters:
        Environment: !Ref Environment
        VpcId: !Ref VpcId
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # API + Lambda Stack
  ApiLambdaStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/api-lambda.yaml
      Parameters:
        Environment: !Ref Environment
        DeploymentBucket: !Ref DeploymentBucket
        TableName: !Ref TableName
        TableArn: !Ref TableArn
        AssetsBucketName: !Ref AssetsBucketName
        AllowedOrigin: !Ref AllowedOrigin
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Auth-edge (Lambda@Edge) Stack — deployed per-branch once the packaged ZIP
  # (with Cognito config baked in) is available. Produces the version ARN that
  # CloudFront attaches as a viewer-request trigger.
  AuthEdgeStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployAuthEdge
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/auth-edge.yaml
      Parameters:
        Environment: !Ref Environment
        DeploymentBucket: !Ref DeploymentBucket
        AuthEdgeS3Key: !Ref AuthEdgeS3Key
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # S3 and CloudFront Stack
  StaticWebsiteStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/static-website.yaml
      Parameters:
        Environment: !Ref Environment
        DomainName: !Ref DomainName
        WwwDomain: !Ref WwwDomain
        CertificateArn: !Ref CertificateArn
        CreateHostedZone: !Ref CreateHostedZone
        AuthEdgeVersionArn: !Ref AuthEdgeVersionArn
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Cognito Stack — only deployed on the main branch.
  # All branch stacks share this User Pool via SSM parameters.
  CognitoStack:
    Type: AWS::CloudFormation::Stack
    Condition: DeployCognito
    DependsOn: StaticWebsiteStack
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/cognito.yaml
      Parameters:
        Environment: !Ref Environment
        GoogleOAuthClientId: !Ref GoogleOAuthClientId
        GoogleOAuthClientSecret: !Ref GoogleOAuthClientSecret
        CallbackUrl: !Ref CallbackUrl
        LogoutUrl: !Ref LogoutUrl
        AllowedGroupEmail: !Ref AllowedGroupEmail
        GoogleServiceAccountSecretArn: !GetAtt SecretsStack.Outputs.GoogleServiceAccountSecretArn
        DeploymentBucket: !Ref DeploymentBucket
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  # Your outputs will go here

  WebServerSecurityGroupId:
    Condition: HasVpcConfig
    Description: Security Group ID for web servers
    Value: !GetAtt SecurityGroupsStack.Outputs.WebServerSecurityGroupId
    Export:
      Name: !Sub ${AWS::StackName}-WebServerSecurityGroupId

  WebsiteBucketName:
    Description: S3 Bucket for website content
    Value: !GetAtt StaticWebsiteStack.Outputs.WebsiteBucketName
    Export:
      Name: !Sub ${AWS::StackName}-WebsiteBucketName

  WebsiteURL:
    Description: S3 Bucket for website content
    Value: !GetAtt StaticWebsiteStack.Outputs.CloudFrontDistributionDomainName

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !GetAtt StaticWebsiteStack.Outputs.CloudFrontDistributionId

  CloudFrontLogsBucketName:
    Description: S3 Bucket for CloudFront logs
    Value: !GetAtt StaticWebsiteStack.Outputs.CloudFrontLogsBucketName
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontLogsBucketName

  ApiEndpoint:
    Description: Team Members API endpoint URL
    Value: !GetAtt ApiLambdaStack.Outputs.ApiEndpoint

  OriginVerifySecretArn:
    Description: ARN of the auto-generated origin-verify secret
    Value: !GetAtt SecretsStack.Outputs.OriginVerifySecretArn

  GoogleServiceAccountSecretArn:
    Description: ARN of the Google service-account secret (populate manually after first deploy)
    Value: !GetAtt SecretsStack.Outputs.GoogleServiceAccountSecretArn

  UserPoolId:
    Condition: DeployCognito
    Description: Cognito User Pool ID
    Value: !GetAtt CognitoStack.Outputs.UserPoolId

  AppClientId:
    Condition: DeployCognito
    Description: Cognito App Client ID
    Value: !GetAtt CognitoStack.Outputs.AppClientId

  CognitoHostedUIDomain:
    Condition: DeployCognito
    Description: Cognito Hosted UI base URL
    Value: !GetAtt CognitoStack.Outputs.CognitoHostedUIDomain

  IdpResponseUrl:
    Condition: DeployCognito
    Description: Redirect URI to add to the Google OAuth client after first deploy
    Value: !GetAtt CognitoStack.Outputs.IdpResponseUrl

  AuthEdgeVersionArn:
    Condition: DeployAuthEdge
    Description: Version ARN of the auth-edge Lambda@Edge function
    Value: !GetAtt AuthEdgeStack.Outputs.AuthEdgeVersionArn
