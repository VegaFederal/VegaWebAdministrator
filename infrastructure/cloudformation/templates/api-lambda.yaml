AWSTemplateFormatVersion: '2010-09-09'
Description: API Gateway (REST API) for VegaWebAdministrator, protected by a regional WAF

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: The deployment environment
  DeploymentBucket:
    Type: String
    Description: S3 bucket containing Lambda functions
  TableName: # parameter for the DynamoDB table name from the dynamodb.yaml file.
    Type: String
    Description: DynamoDB table name
  TableArn: # parameter for the DynamoDB table ARN from the dynamodb.yaml file.
    Type: String
    Description: DynamoDB table ARN
  AssetsBucketName: # parameter for the shared assets S3 bucket from the assets.yaml file.
    Type: String
    Description: Shared assets S3 bucket name
  AllowedOrigin:
    Type: String
    Default: ""
    Description: Allowed site origin (e.g. https://vegafederal.com)
  ApiWafWebAclArn:
    Type: String
    Description: >
      ARN of the regional WAF web ACL (from waf-api.yaml). Required — the API must
      never be deployed without it. The ACL enforces the X-Origin-Verify header.

Resources:
  # REST API, Had to do this for WAF which doesn't work with HTTP APIs.
  # The browser reaches this through CloudFront at /team-members, same origin as the app.
  TeamMembersRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub VegaWebAdmin-TeamMembers-${Environment}
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Resources: /team-members, /team-members/order, /team-members/{id}
  # Static "order" has higher priority than {id}.
  TeamMembersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      ParentId: !GetAtt TeamMembersRestApi.RootResourceId
      PathPart: team-members

  TeamMembersOrderResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      ParentId: !Ref TeamMembersResource
      PathPart: order

  TeamMembersIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      ParentId: !Ref TeamMembersResource
      PathPart: '{id}'

  # Authentication is handled at the CloudFront edge
  # and the WAF origin check.
  GetTeamMembersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      ResourceId: !Ref TeamMembersResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TeamMembersFunction.Arn}/invocations

  PostTeamMembersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      ResourceId: !Ref TeamMembersResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TeamMembersFunction.Arn}/invocations

  PutTeamMembersOrderMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      ResourceId: !Ref TeamMembersOrderResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TeamMembersFunction.Arn}/invocations

  PutTeamMembersIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      ResourceId: !Ref TeamMembersIdResource
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TeamMembersFunction.Arn}/invocations

  DeleteTeamMembersIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      ResourceId: !Ref TeamMembersIdResource
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TeamMembersFunction.Arn}/invocations

  # With this change, REST API deployments will not happen just because of a code change. 
  # CloudFormation only redeploys when the resource itself changes.  if you add/remove/modify 
  # a route or method above, bump the revision in the Description below to force a new deployment.
  TeamMembersDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetTeamMembersMethod
      - PostTeamMembersMethod
      - PutTeamMembersOrderMethod
      - PutTeamMembersIdMethod
      - DeleteTeamMembersIdMethod
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      #Bump this version if you change a route or add a route.
      Description: "routes revision 1"

  TeamMembersRestStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TeamMembersRestApi
      DeploymentId: !Ref TeamMembersDeployment
      StageName: api

  # Associate the regional WAF with the stage. Direct requests without the
  # X-Origin-Verify header are rejected here with a 403.
  ApiWafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${TeamMembersRestApi}/stages/${TeamMembersRestStage}
      WebACLArn: !Ref ApiWafWebAclArn

  TeamMembersLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !Ref TableArn
        - PolicyName: AssetsBucketWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${AssetsBucketName}/*

  TeamMembersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub AdminTeamMembersFunction-${Environment}
      Runtime: python3.12
      Role: !GetAtt TeamMembersLambdaRole.Arn
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          TABLE_ARN: !Ref TableArn
          BUCKET_NAME: !Ref AssetsBucketName
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Sub ${Environment}/lambda/team-members/index.zip

  TeamMembersLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TeamMembersFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TeamMembersRestApi}/*/*

Outputs:
  ApiEndpoint:
    Description: Direct API endpoint. Blocked by the WAF unless X-Origin-Verify is sent, so browsers use /team-members via CloudFront.
    Value: !Sub https://${TeamMembersRestApi}.execute-api.${AWS::Region}.amazonaws.com/${TeamMembersRestStage}/team-members

  ApiDomainName:
    Description: API Gateway domain name (CloudFront origin domain)
    Value: !Sub ${TeamMembersRestApi}.execute-api.${AWS::Region}.amazonaws.com

  ApiStagePath:
    Description: Stage path prefix (CloudFront origin path)
    Value: !Sub /${TeamMembersRestStage}
