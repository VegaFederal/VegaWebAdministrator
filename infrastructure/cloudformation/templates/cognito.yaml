AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cognito User Pool with Google Workspace as the identity provider.
  Domain restriction is enforced via Internal OAuth consent screen and
  the pre-token-generation Lambda (S3).

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: The deployment environment

  GoogleOAuthClientId:
    Type: String
    NoEcho: true
    Description: Google OAuth client ID (read from GitHub Actions secret in CI)

  GoogleOAuthClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth client secret (read from GitHub Actions secret in CI)

  CallbackUrl:
    Type: String
    Description: OAuth callback URL registered on the Cognito App Client

  LogoutUrl:
    Type: String
    Description: Post-logout redirect URL (same base domain as CallbackUrl, path /)

  # Empty in dev. Set to a Google Group email in prods.
  AllowedGroupEmail:
    Type: String
    Default: ""
    Description: >
      Google Group email whose members are allowed (e.g. admin-team@vegafederal.com).
      Set in production-config.json for prod.

  GoogleServiceAccountSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the Google service-account JSON

  DeploymentBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment ZIPs

Resources:

  # Group-check Lambda IAM role
  GroupCheckLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "VegaWebAdmin-GroupCheck-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadGoogleServiceAccountSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GoogleServiceAccountSecretArn

  # In dev (ALLOWED_GROUP_EMAIL empty) In prod it calls the Google 
  # Directory API to verify group membership.
  GroupCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "VegaWebAdmin-GroupCheck-${Environment}"
      Description: >
        Cognito pre-token-generation trigger. Dev = pass-through.
        Prod = verifies user is a member of ALLOWED_GROUP_EMAIL.
      Runtime: python3.12
      Role: !GetAtt GroupCheckLambdaRole.Arn
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          ALLOWED_GROUP_EMAIL: !Ref AllowedGroupEmail
          SERVICE_ACCOUNT_SECRET_ARN: !Ref GoogleServiceAccountSecretArn
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Sub "${Environment}/lambda/group-check/index.zip"
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Allow Cognito to invoke the group-check Lambda
  GroupCheckLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt GroupCheckFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  #  User Pool 
  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn: GroupCheckFunction
    Properties:
      UserPoolName: !Sub "VegaWebAdmin-${Environment}"
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      LambdaConfig:
        PreTokenGeneration: !GetAtt GroupCheckFunction.Arn
      UserPoolTags:
        Environment: !Ref Environment

  #  Google Identity Provider
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleOAuthClientId
        client_secret: !Ref GoogleOAuthClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        picture: picture
        username: sub

  # User Pool App Client 
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub "VegaWebAdmin-Client-${Environment}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref LogoutUrl
      SupportedIdentityProviders:
        - Google
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  # Cognito-managed hosted UI subdomain
  # Domain prefix must be globally unique.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "vegawebadmin-${Environment}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  SsmUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /vegawebadmin/shared/cognito/UserPoolId
      Type: String
      Value: !Ref UserPool
      Description: Shared Cognito User Pool ID (main branch) — read by branch deployments

  SsmAppClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /vegawebadmin/shared/cognito/AppClientId
      Type: String
      Value: !Ref UserPoolClient
      Description: Shared Cognito App Client ID (main branch) — read by branch deployments

  SsmCognitoHostedUIDomain:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /vegawebadmin/shared/cognito/HostedUIDomain
      Type: String
      Value: !Sub "https://vegawebadmin-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
      Description: Shared Cognito Hosted UI base URL — read by branch deployments

  SsmIdpResponseUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /vegawebadmin/shared/cognito/IdpResponseUrl
      Type: String
      Value: !Sub "https://vegawebadmin-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
      Description: Redirect URI to register once in the Google OAuth client

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  AppClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-AppClientId"

  CognitoHostedUIDomain:
    Description: Cognito Hosted UI base URL (no trailing slash)
    Value: !Sub "https://vegawebadmin-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoHostedUIDomain"

  IdpResponseUrl:
    Description: >
      Redirect URI to register in the Google OAuth client under
      "Authorized redirect URIs" — add this after the first deploy.
    Value: !Sub "https://vegawebadmin-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
