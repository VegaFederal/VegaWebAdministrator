AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cognito User Pool with Google Workspace as the identity provider.
  Domain restriction is enforced via Internal OAuth consent screen and
  the pre-token-generation Lambda (S3).

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: The deployment environment

  GoogleOAuthClientId:
    Type: String
    NoEcho: true
    Description: Google OAuth client ID (read from GitHub Actions secret in CI)

  GoogleOAuthClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth client secret (read from GitHub Actions secret in CI)

  CallbackUrl:
    Type: String
    Description: OAuth callback URL registered on the Cognito App Client

  LogoutUrl:
    Type: String
    Description: Post-logout redirect URL (same base domain as CallbackUrl, path /)

Resources:

  # ── User Pool ─────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "VegaWebAdmin-${Environment}"
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      UserPoolTags:
        Environment: !Ref Environment

  # ── Google Identity Provider ───────────────────────────────────────────────
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleOAuthClientId
        client_secret: !Ref GoogleOAuthClientSecret
        authorize_scopes: "openid email profile"
        # Note: domain restriction is NOT done here — Cognito rejects unknown keys.
        # Restriction is enforced at two levels instead:
        # 1. Google OAuth consent screen is set to Internal (Workspace-only)
        # 2. Pre-token-generation Lambda (S3) verifies @vegafederal.com on the email claim
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
        picture: picture
        username: sub

  # User Pool App Client 
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub "VegaWebAdmin-Client-${Environment}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref LogoutUrl
      SupportedIdentityProviders:
        - Google
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  # Cognito-managed hosted UI subdomain
  # Domain prefix must be globally unique; combining environment + account ID
  # guarantees uniqueness across deployments.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "vegawebadmin-${Environment}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  # ── SSM Parameters — written here so branch stacks can read them ──────────
  # Branch deployments never create their own Cognito stack. Instead they read
  # these SSM parameters to discover the shared main-branch User Pool.
  SsmUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /vegawebadmin/shared/cognito/UserPoolId
      Type: String
      Value: !Ref UserPool
      Description: Shared Cognito User Pool ID (main branch) — read by branch deployments

  SsmAppClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /vegawebadmin/shared/cognito/AppClientId
      Type: String
      Value: !Ref UserPoolClient
      Description: Shared Cognito App Client ID (main branch) — read by branch deployments

  SsmCognitoHostedUIDomain:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /vegawebadmin/shared/cognito/HostedUIDomain
      Type: String
      Value: !Sub "https://vegawebadmin-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
      Description: Shared Cognito Hosted UI base URL — read by branch deployments

  SsmIdpResponseUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /vegawebadmin/shared/cognito/IdpResponseUrl
      Type: String
      Value: !Sub "https://vegawebadmin-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
      Description: Redirect URI to register once in the Google OAuth client

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  AppClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-AppClientId"

  CognitoHostedUIDomain:
    Description: Cognito Hosted UI base URL (no trailing slash)
    Value: !Sub "https://vegawebadmin-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoHostedUIDomain"

  IdpResponseUrl:
    Description: >
      Redirect URI to register in the Google OAuth client under
      "Authorized redirect URIs" — add this after the first deploy.
    Value: !Sub "https://vegawebadmin-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
