AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager secrets for CloudFront origin verification

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: The deployment environment

Resources:

  # Google Workspace service-account JSON for the Directory API group membership check.
  # After the first deploy, open Secrets Manager in the console and paste the full
  # service-account JSON downloaded from GCP, adding one extra field:
  #   "admin_email": "admin@vegafederal.com"
  # That field identifies the Workspace admin account used for domain-wide delegation.
  # This secret is only read by the group-check Lambda in prod (ALLOWED_GROUP_EMAIL set).
  GoogleServiceAccountSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/google-service-account"
      Description: >
        Google Workspace service-account JSON for Directory API group membership checks.
        Populate manually after first deploy. Only active in prod when ALLOWED_GROUP_EMAIL is set.
      SecretString: '{"type":"service_account","project_id":"REPLACE_ME","admin_email":"REPLACE_ME"}'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Random 64-char hex token shared between CloudFront (custom header) and
  # API Gateway (resource policy). Auto-generated — never needs manual input.
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/origin-verify"
      Description: >
        Shared secret CloudFront injects as X-Origin-Verify on every request
        to the API origin. API Gateway enforces it via a resource policy.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "token"
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  GoogleServiceAccountSecretArn:
    Description: ARN of the Google Workspace service-account secret
    Value: !Ref GoogleServiceAccountSecret
    Export:
      Name: !Sub "${AWS::StackName}-GoogleServiceAccountSecretArn"

  OriginVerifySecretArn:
    Description: ARN of the origin-verify secret
    Value: !Ref OriginVerifySecret
    Export:
      Name: !Sub "${AWS::StackName}-OriginVerifySecretArn"
