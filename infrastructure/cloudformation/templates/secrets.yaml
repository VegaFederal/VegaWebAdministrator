AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager secrets for Google SSO and CloudFront origin verification

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: The deployment environment

Resources:

  # Google OAuth credentials — placeholder values.
  # After the first deploy, open Secrets Manager in the console and set:
  #   client_id     → your Google OAuth client ID
  #   client_secret → your Google OAuth client secret
  GoogleOAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/google-oauth"
      Description: Google credentials for Cognito identity provider
      SecretString: '{"client_id":"REPLACE_ME","client_secret":"REPLACE_ME"}'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Random 64-char hex token shared between CloudFront (custom header) and
  # API Gateway (resource policy). Auto-generated 
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${Environment}/origin-verify"
      Description: >
        Shared secret CloudFront injects as X-Origin-Verify on every request
        to the API origin. API Gateway enforces with resource policy.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "token"
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  GoogleOAuthSecretArn:
    Description: ARN of the Google OAuth secret
    Value: !Ref GoogleOAuthSecret
    Export:
      Name: !Sub "${AWS::StackName}-GoogleOAuthSecretArn"

  OriginVerifySecretArn:
    Description: ARN of the origin-verify secret
    Value: !Ref OriginVerifySecret
    Export:
      Name: !Sub "${AWS::StackName}-OriginVerifySecretArn"
