AWSTemplateFormatVersion: '2010-09-09'
Description: S3 and CloudFront resources for static website hosting

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: The deployment environment

  DomainName:
    Type: String
    Default: ""
    Description: Custom domain name (e.g., example.com)

  WwwDomain:
    Type: String
    Default: ""
    Description: WWW subdomain (e.g., www.vegafederal.com)

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM Certificate ARN for HTTPS

  CreateHostedZone:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create Route 53 hosted zone for domain

  AuthEdgeVersionArn:
    Type: String
    Default: ""
    Description: >
      Qualified version ARN of the auth edge function. When set, it is
      attached to the default cache behavior as a viewer-request trigger.

  ApiDomainName:
    Type: String
    Description: API Gateway domain name used as the second CloudFront origin (no scheme)

  ApiOriginPath:
    Type: String
    Description: API Gateway stage path prefix for the origin (e.g. /api)

  OriginVerifySecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Plaintext X-Origin-Verify token (resolved from Secrets Manager in CI).
      CloudFront adds it to every request sent to the API origin; the regional WAF
      rejects API requests that don't carry it.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasWwwDomain: !Not [!Equals [!Ref WwwDomain, ""]]
  ShouldCreateHostedZone: !And [!Condition HasCustomDomain, !Equals [!Ref CreateHostedZone, "true"]]
  HasAuthEdge: !Not [!Equals [!Ref AuthEdgeVersionArn, ""]]
  HasOriginVerifySecret: !Not [!Equals [!Ref OriginVerifySecret, ""]]

Resources:
  # S3 Bucket for CloudFront logs
  CloudFrontLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "vegawebadmin-${Environment}-cloudfront-logs-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-cloudfront-logs-bucket
        - Key: Environment
          Value: !Ref Environment

  # S3 Bucket for static assets
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-website-bucket
        - Key: Environment
          Value: !Ref Environment

  # Origin Access Control for CloudFront
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Environment}-${AWS::AccountId}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref Environment
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
          # API Gateway origin. CloudFront injects X-Origin-Verify so the regional
          # WAF will accept the request; direct calls to the API URL lack it.
          - DomainName: !Ref ApiDomainName
            Id: ApiOrigin
            OriginPath: !Ref ApiOriginPath
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders: !If
              - HasOriginVerifySecret
              - - HeaderName: X-Origin-Verify
                  HeaderValue: !Ref OriginVerifySecret
              - !Ref AWS::NoValue
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          TargetOriginId: S3Origin
          ForwardedValues:
            # Query string is needed so the /callback code+state reach the Lambda,
            # and cookies are needed so the auth guard can read the session token.
            QueryString: true
            Cookies:
              Forward: all
          ViewerProtocolPolicy: redirect-to-https
          LambdaFunctionAssociations: !If
            - HasAuthEdge
            - - EventType: viewer-request
                LambdaFunctionARN: !Ref AuthEdgeVersionArn
                IncludeBody: false
            - !Ref AWS::NoValue
        CacheBehaviors:
          # The app calls the API at /team-members on the same domain, so the browser
          # never sees the API Gateway URL. Never cached; the auth trigger applies
          # here too so unauthenticated users cannot call the API through CloudFront.
          - PathPattern: /team-members*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            # Managed-CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            LambdaFunctionAssociations: !If
              - HasAuthEdge
              - - EventType: viewer-request
                  LambdaFunctionARN: !Ref AuthEdgeVersionArn
                  IncludeBody: false
              - !Ref AWS::NoValue
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # Forward only what the API needs. 
  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-ApiOriginRequest"
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Origin
            - Referer
            - Content-Type
            - Accept

  # Security Headers Policy
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-SecurityHeaders"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: false
          ContentTypeOptions:
            Override: false
          FrameOptions:
            FrameOption: DENY
            Override: false
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: false
        CustomHeadersConfig:
          Items:
            - Header: X-Permitted-Cross-Domain-Policies
              Value: none
              Override: false
            - Header: Permissions-Policy
              Value: geolocation=(), microphone=(), camera=()
              Override: false

  # Bucket Policy for CloudFront OAC access
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Action: s3:GetObject
            Effect: Allow
            Resource: !Sub ${WebsiteBucket.Arn}/*
            Principal:
              Service: cloudfront.amazonaws.com
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

   # AWS WAF WebACL for security
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-WebACL"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsMetric
        - Name: RateLimitRule
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitMetric
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-WebACL"

  # Route 53 Hosted Zone
  HostedZone:
    Type: AWS::Route53::HostedZone
    Condition: ShouldCreateHostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub "Hosted zone for ${DomainName}"

  # DNS Record for CloudFront (apex domain)
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneName: !Sub "${DomainName}."
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # DNS Record for www subdomain
  WwwDNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasWwwDomain
    Properties:
      HostedZoneName: !Sub "${DomainName}."
      Name: !Ref WwwDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  WebsiteBucketName:
    Description: S3 Bucket for website content
    Value: !Ref WebsiteBucket

  CloudFrontLogsBucketName:
    Description: S3 Bucket for CloudFront logs
    Value: !Ref CloudFrontLogsBucket
    
  CloudFrontDistributionDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution